services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: duty-rotation-sql
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD}
      MSSQL_PID: Developer
    ports:
      - "1433:1433"
    volumes:
      # Named volume: the database itself must survive container removal.
      - sqldata:/var/opt/mssql
      # Bind mounts: SQL scripts are edited on the host and read inside the container.
      - ./sql:/sql:ro
      - ./tests:/tests:ro

volumes:
  sqldata:
